<!-- Simple visual homepage for Contact Manager API -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager API</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #d8e3e7, #e0f7fa);
      color: #333;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #0077b6;
    }
    p {
      font-size: 18px;
    }
    .box {
      background: white;
      padding: 20px;
      margin: 30px auto;
      width: 80%;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome to Contact Manager API</h1>
    <p>Developed by <b>Hiyaben Hareshbhai Jayswal</b></p>
    <p>📚 Course: COMP3033 - Node.js Programming</p>
    <p>🚀 Use Postman to test CRUD routes:</p>
    <ul style="list-style:none;">
      <li>GET → /api/contacts</li>
      <li>POST → /api/contacts</li>
      <li>PUT → /api/contacts/:id</li>
      <li>DELETE → /api/contacts/:id</li>
    </ul>
  </div>
</body>
</html>
